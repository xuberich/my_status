<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FAFAF8">
  <meta name="description" content="实时查看手机状态">
  <title>手机状态 · Phone Status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #FAFAF8;
      --bg-elevated: #FFFFFF;
      --bg-subtle: rgba(245, 245, 240, 0.6);
      --bg-hover: rgba(239, 239, 232, 0.7);
      --text-primary: #1A1A18;
      --text-secondary: #6B6B63;
      --text-muted: #9C9C94;
      --text-inverse: #FFFFFF;
      --accent: #C4A77D;
      --accent-light: #E8DCC8;
      --accent-dark: #9A7B4F;
      --status-online: #7CB97C;
      --status-offline: #BDBDB5;
      --status-charging: #E8C547;
      --status-low: #D4846A;
      --mood-gaming: #E8C547;
      --mood-working: #7CB97C;
      --mood-slacking: #A8A0D6;
      --mood-latenight: #4A4A5C;
      --border: rgba(0, 0, 0, 0.06);
      --grid-color: rgba(0, 0, 0, 0.06);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06), 0 2px 4px rgba(0, 0, 0, 0.02);
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --duration-fast: 150ms;
      --duration-normal: 250ms;
    }

    /* SVG 图标基础样式 */
    .icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .icon-sm { width: 14px; height: 14px; }
    .icon-lg { width: 20px; height: 20px; }
    .icon-xl { width: 24px; height: 24px; }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ========== 移动端布局 ========== */
    .page {
      min-height: 100vh;
      padding: 20px;
    }

    .sidebar {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
      box-shadow: var(--shadow-sm);
    }

    .brand-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--status-online);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .brand-subtitle {
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-top: -4px;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--text-primary);
      color: var(--text-inverse);
      text-decoration: none;
      font-size: 0.8125rem;
      font-weight: 600;
      border-radius: 100px;
      transition: transform var(--duration-normal) var(--ease-out), box-shadow var(--duration-normal) var(--ease-out);
    }

    .brand-link:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .brand-link svg { width: 16px; height: 16px; }

    .main-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ========== PC端三栏布局 ========== */
    @media (min-width: 1024px) {
      .page {
        height: 100vh;
        padding: 24px 32px;
        display: grid;
        grid-template-columns: 200px 1fr 320px;
        gap: 24px;
        overflow: hidden;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: left;
        margin-bottom: 0;
      }

      .brand {
        align-items: flex-start;
      }

      .brand-title {
        font-size: 1.75rem;
      }

      .main-content {
        display: contents;
      }
    }

    @media (min-width: 1280px) {
      .page {
        padding: 32px 48px;
        grid-template-columns: 240px 1fr 360px;
        gap: 32px;
      }

      .brand-title {
        font-size: 2rem;
      }
    }

    /* ========== 卡片样式 ========== */
    .card {
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 1024px) {
      .card {
        height: 100%;
      }
    }

    .card-header {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: transparent;
    }

    .card-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--bg-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.875rem;
    }

    .card-body {
      padding: 14px 16px;
      flex: 1;
      overflow-y: auto;
      background: transparent;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 1024px) {
      .card-body {
        justify-content: space-between;
      }
    }

    .card-body::-webkit-scrollbar { width: 4px; }
    .card-body::-webkit-scrollbar-track { background: transparent; }
    .card-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ========== 状态徽章 ========== */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 100px;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .status-badge.online { background: rgba(124, 185, 124, 0.12); color: var(--status-online); }
    .status-badge.offline { background: var(--bg-subtle); color: var(--text-muted); }
    .status-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .status-badge.online .status-badge-dot { animation: pulse 2s ease-in-out infinite; }

    /* ========== 心情横幅 ========== */
    .mood-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      font-size: 0.9375rem;
      font-weight: 600;
    }

    .mood-banner-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .mood-gaming { background: rgba(232, 197, 71, 0.1); color: #8B7424; }
    .mood-gaming .mood-banner-icon { background: rgba(232, 197, 71, 0.2); }
    .mood-working { background: rgba(124, 185, 124, 0.1); color: #3D6B3D; }
    .mood-working .mood-banner-icon { background: rgba(124, 185, 124, 0.2); }
    .mood-slacking { background: rgba(168, 160, 214, 0.1); color: #5D5580; }
    .mood-slacking .mood-banner-icon { background: rgba(168, 160, 214, 0.2); }
    .mood-latenight { background: var(--mood-latenight); color: #E8E8F0; }
    .mood-latenight .mood-banner-icon { background: rgba(255, 255, 255, 0.15); }
    .mood-idle, .mood-normal { background: var(--bg-subtle); color: var(--text-secondary); }
    .mood-idle .mood-banner-icon, .mood-normal .mood-banner-icon { background: var(--bg-hover); }

    /* ========== 状态签名 ========== */
    .status-message {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 12px;
      background: linear-gradient(135deg, var(--accent-light) 0%, rgba(232, 220, 200, 0.3) 100%);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      border-left: 3px solid var(--accent);
    }

    .status-message-icon { font-size: 1rem; line-height: 1; }
    .status-message-text { font-size: 0.8125rem; color: var(--accent-dark); line-height: 1.4; font-weight: 500; }

    /* ========== 当前应用 ========== */
    .current-app {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--bg-subtle);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
    }

    .app-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      color: var(--text-inverse);
      flex-shrink: 0;
    }

    .app-info { flex: 1; min-width: 0; }
    .app-name { font-size: 1.125rem; font-weight: 700; color: var(--text-primary); margin-bottom: 2px; }
    .app-status { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }

    /* ========== 统计网格 ========== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-card {
      background: var(--bg-subtle);
      border-radius: var(--radius-sm);
      padding: 14px 10px;
      text-align: center;
      transition: background var(--duration-fast) var(--ease-out);
    }

    .stat-card:hover { background: var(--bg-hover); }
    .stat-icon { font-size: 1.125rem; margin-bottom: 6px; display: flex; justify-content: center; }
    .stat-value { font-size: 1.0625rem; font-weight: 700; color: var(--text-primary); margin-bottom: 2px; }
    .stat-label { font-size: 0.5625rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

    /* ========== 信息列表 ========== */
    .info-list { display: flex; flex-direction: column; gap: 8px; }

    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg-subtle);
      border-radius: var(--radius-sm);
      transition: background var(--duration-fast) var(--ease-out);
    }

    .info-item:hover { background: var(--bg-hover); }

    .info-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .info-content { flex: 1; min-width: 0; }
    .info-label { font-size: 0.5625rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .info-value { font-size: 0.8125rem; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .battery-bar { height: 4px; background: var(--bg-hover); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .battery-fill { height: 100%; border-radius: 2px; transition: width 0.6s var(--ease-out); }
    .battery-fill.high { background: linear-gradient(90deg, var(--status-online) 0%, #9ACB9A 100%); }
    .battery-fill.medium { background: linear-gradient(90deg, var(--status-charging) 0%, #F0D668 100%); }
    .battery-fill.low { background: linear-gradient(90deg, var(--status-low) 0%, #E0A090 100%); }

    /* ========== Top Apps ========== */
    .top-apps { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }
    .top-apps-title { font-size: 0.5625rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
    .top-app-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .top-app-item:last-child { border-bottom: none; }
    .top-app-rank { font-size: 0.75rem; margin-right: 8px; }
    .top-app-name { flex: 1; font-size: 0.875rem; font-weight: 500; color: var(--text-primary); }
    .top-app-time { font-size: 0.75rem; color: var(--text-secondary); font-weight: 600; background: var(--bg-subtle); padding: 3px 8px; border-radius: 100px; }

    .update-time { text-align: center; font-size: 0.6875rem; color: var(--text-muted); margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }

    /* ========== 访客卡片 ========== */
    .visitors-stats { display: flex; gap: 16px; }
    .visitor-stat { text-align: center; }
    .visitor-stat-value { font-size: 1.125rem; font-weight: 700; color: var(--text-primary); }
    .visitor-stat-label { font-size: 0.5rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

    .visitor-list { display: flex; flex-direction: column; gap: 6px; }

    .visitor-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--bg-subtle);
      border-radius: var(--radius-sm);
      transition: background var(--duration-fast) var(--ease-out);
    }

    .visitor-item:hover { background: var(--bg-hover); }

    .visitor-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--text-secondary) 0%, var(--text-muted) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-inverse);
      flex-shrink: 0;
    }

    .visitor-info { flex: 1; min-width: 0; }
    .visitor-location { font-size: 0.8125rem; font-weight: 600; color: var(--text-primary); }
    .visitor-meta { font-size: 0.625rem; color: var(--text-muted); }
    .visitor-status { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .visitor-status.online { background: var(--status-online); box-shadow: 0 0 6px rgba(124, 185, 124, 0.4); }
    .visitor-status.offline { background: var(--border); }

    /* ========== 骨架屏 ========== */
    .skeleton {
      background: linear-gradient(90deg, var(--bg-subtle) 25%, var(--bg-hover) 50%, var(--bg-subtle) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.8s ease-in-out infinite;
      border-radius: var(--radius-sm);
    }

    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .loading-state { padding: 16px; }
    .skeleton-app { width: 100%; height: 72px; margin-bottom: 12px; }
    .skeleton-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .skeleton-stat { height: 70px; }
    .skeleton-item { height: 52px; margin-bottom: 6px; }
    .skeleton-item:last-child { margin-bottom: 0; }

    /* ========== 入场动画 ========== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sidebar { animation: fadeIn 0.5s var(--ease-out) 0.1s both; }
    .card:first-of-type { animation: fadeIn 0.5s var(--ease-out) 0.15s both; }
    .card:last-of-type { animation: fadeIn 0.5s var(--ease-out) 0.2s both; }
  </style>
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-badge">
          <span class="brand-badge-dot"></span>
          <span>实时同步</span>
        </div>
        <h1 class="brand-title">手机状态</h1>
        <p class="brand-subtitle">Real-time Phone Status</p>
        <a href="https://space.bilibili.com/631853247" target="_blank" rel="noopener" class="brand-link">

          <span>Le_Ho</span>

      </div>
    </aside>

    <div class="main-content">
      <section class="card" id="status-card">
        <div class="loading-state">
          <div class="skeleton skeleton-app"></div>
          <div class="skeleton-stats">
            <div class="skeleton skeleton-stat"></div>
            <div class="skeleton skeleton-stat"></div>
            <div class="skeleton skeleton-stat"></div>

          <div class="skeleton skeleton-item"></div>
          <div class="skeleton skeleton-item"></div>
          <div class="skeleton skeleton-item"></div>

        <div class="card-body">

        </div>
      </aside>
    </div>
  </div>

  <script>
    // SVG 图标库
    const icons = {
      smartphone: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>',
      users: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
      gamepad: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="2"/></svg>',
      briefcase: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
      coffee: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></svg>',
      moon: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
      zap: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
      battery: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="10" x="2" y="7" rx="2" ry="2"/><line x1="22" x2="22" y1="11" y2="13"/></svg>',
      batteryCharging: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/><path d="M6 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1"/><path d="m11 7-3 5h4l-3 5"/><line x1="22" x2="22" y1="11" y2="13"/></svg>',
      wifi: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a10 10 0 0 1 14 0"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" x2="12.01" y1="20" y2="20"/></svg>',
      wifiOff: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="22" y1="2" y2="22"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><line x1="12" x2="12.01" y1="20" y2="20"/></svg>',
      mapPin: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
      music: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
      barChart: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></svg>',
      footprints: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4"/><path d="M4 13h4"/></svg>',
      messageCircle: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></svg>',
      monitor: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>',
      eye: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>',
      award: '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>',
    };

    const isSelfHosted = window.location.hostname === 'localhost'
      || window.location.hostname.includes('dwill.top')
      || window.location.port !== '';

    const API_BASE = isSelfHosted
      ? window.location.origin + '/api'
      : 'https://phone-status-api-v2.zhangtao3788.workers.dev';

    const appNameMap = {
      'com.tencent.mm': '微信', 'com.tencent.mobileqq': 'QQ', 'com.sina.weibo': '微博',
      'com.zhihu.android': '知乎', 'com.xingin.xhs': '小红书', 'org.telegram.messenger': 'Telegram',
      'com.tencent.tmgp.sgame': '王者荣耀', 'com.tencent.tmgp.pubgmhd': '和平精英',
      'com.miHoYo.Yuanshen': '原神', 'com.miHoYo.hkrpg': '崩坏：星穹铁道', 'tv.danmaku.bili': '哔哩哔哩',
      'com.ss.android.ugc.aweme': '抖音', 'com.netease.cloudmusic': '网易云音乐',
      'com.microsoft.emmx': 'Edge', 'com.android.chrome': 'Chrome', 'com.quark.browser': '夸克',
      'com.taobao.taobao': '淘宝', 'com.taobao.idlefish': '闲鱼', 'com.xunmeng.pinduoduo': '拼多多',
      'com.sankuai.meituan': '美团', 'com.eg.android.AlipayGphone': '支付宝',
      'com.github.android': 'GitHub', 'com.bbk.launcher2': '桌面', 'com.vivo.launcher': '桌面',
    };

    const moodConfig = {
      gaming: { text: '战斗模式', icon: 'gamepad', class: 'mood-gaming' },
      working: { text: '专注工作', icon: 'briefcase', class: 'mood-working' },
      slacking: { text: '摸鱼时间', icon: 'coffee', class: 'mood-slacking' },
      idle: { text: '休息中', icon: 'moon', class: 'mood-idle' },
      normal: { text: '使用中', icon: 'smartphone', class: 'mood-normal' },
    };

    function getAppName(pkg, custom) { return custom || appNameMap[pkg] || pkg.split('.').pop(); }

    function formatTime(ts) {
      const diff = Date.now() - ts;
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
      return new Date(ts).toLocaleString('zh-CN');
    }

    function formatMinutes(m) {
      if (m < 60) return m + '分钟';
      const h = Math.floor(m / 60), min = m % 60;
      return min > 0 ? h + '小时' + min + '分' : h + '小时';
    }

    function renderStatus(s) {
      const online = Date.now() - s.timestamp < 300000;
      const appName = s.appName || getAppName(s.app);
      const batteryClass = s.battery > 50 ? 'high' : s.battery > 20 ? 'medium' : 'low';
      const device = (s.device || '').replace('Vivo V2405A', 'vivo X200 Pro');
      let moodInfo = moodConfig[s.mood] || moodConfig.normal;
      if (s.isLateNight) moodInfo = { text: '夜猫子模式', icon: 'moon', class: 'mood-latenight' };

      let batteryText = s.battery + '%';
      if (s.battery <= 10) batteryText += ' ⚠';
      else if (s.charging) batteryText += ' ⚡';

      const rankIcons = ['#1', '#2', '#3'];
      const topAppsHtml = s.topApps && s.topApps.length ? `
        <div class="top-apps">
          <div class="top-apps-title">${icons.barChart}今日最常用</div>
          ${s.topApps.map((a, i) => `
            <div class="top-app-item">
              <span class="top-app-rank">${rankIcons[i]}</span>
              <span class="top-app-name">${a.name}</span>
              <span class="top-app-time">${formatMinutes(a.minutes)}</span>
            </div>
          `).join('')}
        </div>
      ` : '';

      document.getElementById('status-card').innerHTML = `
        <div class="card-header">
          <span class="card-title"><span class="card-title-icon">${icons.smartphone}</span>设备状态</span>
          <span class="status-badge ${online ? 'online' : 'offline'}"><span class="status-badge-dot"></span>${online ? '在线' : '离线'}</span>
        </div>
        <div class="card-body">
          <div class="mood-banner ${moodInfo.class}">
            <div class="mood-banner-icon">${icons[moodInfo.icon]}</div>
            <span>${moodInfo.text}</span>
          </div>
          ${s.statusMessage ? `<div class="status-message"><span class="status-message-icon">${icons.messageCircle}</span><span class="status-message-text">${s.statusMessage}</span></div>` : ''}
          <div class="current-app">
            <div class="app-icon">${icons.smartphone}</div>
            <div class="app-info">
              <div class="app-name">${s.screen ? appName : '屏幕已关闭'}</div>
              <div class="app-status">${online ? '正在使用' : '离线'} · ${device}</div>
            </div>
          </div>
          <div class="stats-grid">
            <div class="stat-card"><span class="stat-icon">${icons.monitor}</span><div class="stat-value">${formatMinutes(s.screenTime || 0)}</div><div class="stat-label">今日屏幕</div></div>
            <div class="stat-card"><span class="stat-icon">${icons.gamepad}</span><div class="stat-value">${formatMinutes(s.gameTime || 0)}</div><div class="stat-label">今日游戏</div></div>
            <div class="stat-card"><span class="stat-icon">${icons.footprints}</span><div class="stat-value">${(s.steps || 0).toLocaleString()}</div><div class="stat-label">今日步数</div></div>
          </div>
          <div class="info-list">
            <div class="info-item">
              <div class="info-icon">${s.charging ? icons.batteryCharging : icons.battery}</div>
              <div class="info-content">
                <div class="info-label">电量${s.batteryTemp ? ' · ' + s.batteryTemp + '°C' : ''}</div>
                <div class="info-value">${batteryText}</div>
                <div class="battery-bar"><div class="battery-fill ${batteryClass}" style="width:${s.battery}%"></div></div>
              </div>
            </div>
            <div class="info-item">
              <div class="info-icon">${s.wifi ? icons.wifi : icons.wifiOff}</div>
              <div class="info-content">
                <div class="info-label">网络</div>
                <div class="info-value">${s.networkType || 'WiFi'}${s.wifiName ? ' · ' + s.wifiName : ''}</div>
              </div>
            </div>
            ${s.location ? `<div class="info-item"><div class="info-icon">${icons.mapPin}</div><div class="info-content"><div class="info-label">位置</div><div class="info-value">${s.location}</div></div></div>` : ''}
            ${s.music ? `<div class="info-item"><div class="info-icon">${icons.music}</div><div class="info-content"><div class="info-label">正在播放</div><div class="info-value">${s.music}${s.musicArtist ? ' - ' + s.musicArtist : ''}</div></div></div>` : ''}
          </div>
          ${topAppsHtml}
          <div class="update-time">更新于 ${formatTime(s.timestamp)}</div>
        </div>
      `;
    }

    function renderVisitors(stats) {
      document.getElementById('visitors-stats').innerHTML = `
        <div class="visitor-stat"><div class="visitor-stat-value">${stats.online}</div><div class="visitor-stat-label">在线</div></div>
        <div class="visitor-stat"><div class="visitor-stat-value">${stats.today}</div><div class="visitor-stat-label">今日</div></div>
        <div class="visitor-stat"><div class="visitor-stat-value">${stats.total}</div><div class="visitor-stat-label">总计</div></div>
      `;

      const listHtml = stats.recentVisitors.length ? stats.recentVisitors.map(v => {
        const online = Date.now() - v.lastVisit < 300000;
        const browser = v.ua.includes('Edg') ? 'Edge' : v.ua.includes('Chrome') ? 'Chrome' : v.ua.includes('Firefox') ? 'Firefox' : v.ua.includes('Safari') ? 'Safari' : '浏览器';
        return `
          <div class="visitor-item">
            <div class="visitor-avatar">${browser[0]}</div>
            <div class="visitor-info">
              <div class="visitor-location">${v.city || '未知'} · ${browser}</div>
              <div class="visitor-meta">${formatTime(v.lastVisit)}</div>
            </div>
            <div class="visitor-status ${online ? 'online' : 'offline'}"></div>
          </div>
        `;
      }).join('') : '<div style="text-align:center;color:var(--text-muted);padding:32px 16px;font-size:0.8125rem;">暂无访客记录</div>';

      document.getElementById('visitor-list').innerHTML = listHtml;
    }

    async function fetchStatus() {
      try {
        const res = await fetch(API_BASE + '/status');
        if (res.ok) renderStatus(await res.json());
      } catch (e) { console.error('Fetch status error:', e); }
    }

    async function fetchVisitors() {
      try {
        const res = await fetch(API_BASE + '/visitors');
        if (res.ok) renderVisitors(await res.json());
      } catch (e) { console.error('Fetch visitors error:', e); }
    }

    async function recordVisit() { try { await fetch(API_BASE + '/visit'); } catch (e) {} }

    fetchStatus();
    recordVisit();
    fetchVisitors();
    setInterval(fetchStatus, 15000);
    setInterval(fetchVisitors, 30000);
  </script>
</body>
</html>
