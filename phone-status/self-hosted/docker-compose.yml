version: '3.8'

services:
  phone-status:
    build:
      context: ..
      dockerfile: self-hosted/Dockerfile
    container_name: phone-status
    restart: unless-stopped
    ports:
      - "9529:9529"
    environment:
      - NODE_ENV=production
      - PORT=9529
      - API_KEY=${API_KEY:-dwill-status-2026-x7k9m2p4q8r1}
      - TZ=Asia/Shanghai
    volumes:
      # 数据持久化
      - phone-status-data:/app/data
    networks:
      - phone-status-net
    labels:
      - "com.docker.compose.project=phone-status"

volumes:
  phone-status-data:
    driver: local

networks:
  phone-status-net:
    driver: bridge
