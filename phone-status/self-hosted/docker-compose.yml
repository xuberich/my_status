version: '3.8'

services:
  phone-status:
    build:
      context: ..
      dockerfile: self-hosted/Dockerfile
    container_name: phone-status
    restart: always
    ports:
      - "9529:9529" # 宿主机 9529 供 Caddy 反代
    environment:
      - NODE_ENV=production
      - PORT=9529
      - API_KEY=${API_KEY:-dwill-status-2026-x7k9m2p4q8r1}
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data # 将数据持久化到当前目录下的 data 文件夹
    networks:
      - phone-status-net

networks:
  phone-status-net:
    driver: bridge
